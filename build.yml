name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Android project around index.html
        run: |
          set -e
          test -f index.html
          mkdir -p app/src/main/assets app/src/main/java/com/example/signallab
          cp index.html app/src/main/assets/index.html

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SignalLab"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.signallab"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.signallab"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Signal Lab"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/signallab/MainActivity.kt <<'EOF'
          package com.example.signallab

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private val pool = Executors.newFixedThreadPool(3)

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.addJavascriptInterface(Bridge(), "Native")
                  web.webViewClient = WebViewClient()
                  web.loadUrl("file:///android_asset/index.html")
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun get(id: Int, url: String) {
                      pool.execute {
                          var ok = false
                          var body = ""
                          try {
                              val c = URL(url).openConnection() as HttpURLConnection
                              c.connectTimeout = 15000
                              c.readTimeout = 25000
                              c.setRequestProperty("User-Agent", "Mozilla/5.0")
                              body = c.inputStream.bufferedReader().use { it.readText() }
                              ok = true
                          } catch (e: Exception) {
                              body = e.toString()
                          }
                          val js = "window.onNative(" + id + "," + ok + "," + JSONObject.quote(body) + ")"
                          runOnUiThread { web.evaluateJavascript(js, null) }
                      }
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  super.onBackPressed()
              }
          }
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SignalLab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SignalLab-apk
          path: SignalLab.apk

      - name: Publish as a release (easy download on phone)
        continue-on-error: true
        uses: ncipollo/release-action@v1
        with:
          tag: latest-build
          name: Latest build
          body: Signal Lab APK, built automatically.
          artifacts: SignalLab.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
